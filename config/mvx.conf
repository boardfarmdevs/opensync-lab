# opensync-lab defaults. Every value can be overridden from the environment
# (VAR=value ./build-mvx.sh ...). Machine-local overrides that should persist
# (e.g. the VM name picked on the first run) go in config/local.conf, which is
# sourced after this file and is not committed.

# --- product / release -------------------------------------------------------
: "${MVX_PRODUCT:=mv3}"
: "${MVX_RELEASE:=r25-oe40}"

# Reference build the pins are captured from, and the pin set name.
: "${MVX_REF_BUILD:=$HOME/yocto/mv3-lxd-r25-oe40-0808}"
: "${MVX_PINS:=mv3-r25-oe40-0808}"

# repo --mirror checkout used both as --reference and as the offline source
# of every manifest project.
: "${MVX_REPO_REF:=$HOME/yocto/repo_reference/${MVX_PRODUCT}-${MVX_RELEASE}-repo_reference}"

# Fresh build directory. Must keep the <product>-lxd-<release>-<MMDD> shape:
# mv.sh and the mv-builds tooling parse product/release out of it.
: "${MVX_BUILD_DATE:=$(date +%m%d)}"
: "${MVX_BUILD_DIR:=$HOME/yocto/${MVX_PRODUCT}-lxd-${MVX_RELEASE}-${MVX_BUILD_DATE}}"

# Shared bitbake caches (same as every other mvx build on this host).
: "${MVX_DL_DIR:=$HOME/oe/downloads}"
: "${MVX_SSTATE_DIR:=$HOME/oe/sstate-cache}"

# Working clones of the ~rvogelaar layers (offline source for meta-lxd*).
: "${MVX_GIT_DIR:=$HOME/git}"

# --- lab VM --------------------------------------------------------------------
: "${MVX_VM:=opensync-lab-$(date +%m%d)}"
: "${MVX_VM_IMAGE:=ubuntu:24.04}"
: "${MVX_VM_CPUS:=4}"
: "${MVX_VM_MEMORY:=8GiB}"
: "${MVX_VM_DISK:=64GiB}"
: "${MVX_VM_STORAGE:=default}"
: "${MVX_VM_NETWORK:=lxdbr0}"

# boardfarm-lab-staging revision installed in the VM.
: "${MVX_BOARDFARM_SOURCE:=git@github.com:robvogelaar/boardfarm-lab-staging.git}"
: "${MVX_BOARDFARM_COMMIT:=eeb4803c00dc1cae2dda05eb6e1b52c06ad79aa8}"

# hwsim pool inside the VM (matches meta-lxd gen-util.sh defaults).
: "${MVX_HWSIM_POOL:=24}"
: "${MVX_HWSIM_CHANNELS:=2}"

# --- deploy --------------------------------------------------------------------
# meta-lxd revision whose gen/ (mv.sh) runs in the VM: "pin" = the build pin.
: "${MVX_RUNTIME_META_LXD:=pin}"
# Image to deploy; empty = the artifact of MVX_BUILD_DIR.
: "${MVX_IMAGE:=}"
# mv.sh -i <n>; empty = container named after the product ("mv3").
: "${MVX_INSTANCE:=}"
: "${MVX_HWSIM_RADIOS:=3}"

# --- OpenSync cloud ------------------------------------------------------------
# plume: the real cloud (TLS, Plume redirector); local: local-noc in the lab VM
# (plain-TCP OVSDB redirector + controller that records the whole protocol).
: "${MVX_CLOUD:=plume}"
: "${MVX_PLUME_REDIRECTOR:=ssl:wildfire.plume.tech:443}"
# local-noc sits on boardfarm's WAN segment (docker network wan-cpe1), next to
# where boardfarm's own services live; wan-cpe1 NATs the CPE's WAN onto it.
: "${MVX_LOCAL_NOC_IP:=10.101.0.40}"
: "${MVX_LOCAL_NOC_REDIRECTOR_PORT:=6640}"
: "${MVX_LOCAL_NOC_CONTROLLER_PORT:=6641}"
# local-noc web UI (topology view), published on the host as
# http://<MVX_NOC_UI_LISTEN>:<MVX_NOC_UI_PORT>/ (default listen: the host's
# primary address; LXD's NAT proxy into a VM cannot listen on 0.0.0.0)
: "${MVX_NOC_UI_PORT:=8640}"
: "${MVX_NOC_UI_LISTEN:=}"

# --- mesh: OpenSync extender (pod) -----------------------------------------------
# local-noc orchestrates the location like the cloud: the gateway's backhaul AP,
# a GRE per pod, the pods' fronthaul. The backhaul SSID/PSK must match the
# onboarding credentials built into the pod image
# (pod/opensync/service-provider/mvx-local/build/provider.mk).
: "${MVX_MESH_GATEWAY:=$MVX_PRODUCT}"          # AWLAN_Node.id of the gateway
: "${MVX_MESH_BHAUL_IF:=wl1.1}"
: "${MVX_MESH_BHAUL_SSID:=opensync-lab-bhaul}"
: "${MVX_MESH_BHAUL_PSK:=opensync-lab-bhaul-psk}"
: "${MVX_MESH_HOME_SSID:=opensync-lab-home}"
: "${MVX_MESH_HOME_PSK:=opensync-lab-home-psk}"
# lab topology (deploy-mvx.sh mesh): extenders pod-1..N, clients pod-N-wc1..M
: "${MVX_PODS:=3}"
: "${MVX_POD_CLIENTS:=2}"
