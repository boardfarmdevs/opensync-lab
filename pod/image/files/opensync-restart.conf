# OpenSync's Plan B (a manager it cannot recover, or no OVSDB when dm starts) ends dm
# with exit 1 and runs a restart script to start OpenSync again. Under systemd the
# restart is this: core's opensync.service has Restart=no, and the script Plan B runs
# (<scripts dir>/restart.sh) is not where the SYSTEMD rootfs installs it (bin/), so
# without this the pod stayed down. A stop or restart that is asked for (systemctl,
# cm's FATAL restart through bin/restart.sh) is not a failure and is not repeated.
[Service]
Restart=on-failure
RestartSec=10
