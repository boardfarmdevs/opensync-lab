# meta-mvx: opensync-lab's fixes on top of the pinned layers, as bbappends
# with patches (build-mvx.sh adds this layer to bblayers.conf). Each belongs
# upstream; see README.md "Workarounds".
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "opensync-lab"
BBFILE_PATTERN_opensync-lab = "^${LAYERDIR}/"
BBFILE_PRIORITY_opensync-lab = "30"

LAYERDEPENDS_opensync-lab = "core meta-lxd"
LAYERSERIES_COMPAT_opensync-lab = "kirkstone"
