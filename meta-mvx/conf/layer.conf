# meta-mvx: mvx-opensync's fixes on top of the pinned layers, as bbappends
# with patches (build-mvx.sh adds this layer to bblayers.conf). Each belongs
# upstream; see README.md "Workarounds".
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mvx-opensync"
BBFILE_PATTERN_mvx-opensync = "^${LAYERDIR}/"
BBFILE_PRIORITY_mvx-opensync = "30"

LAYERDEPENDS_mvx-opensync = "core meta-lxd"
LAYERSERIES_COMPAT_mvx-opensync = "kirkstone"
